name: On-demand chart

# Chart images for one symbol, on demand: Actions -> On-demand chart ->
# Run workflow.
#
# The Telegram /chart command answers with numbers straight from the Worker and
# needs nothing set up. This exists for when you want the actual pictures — a
# free Worker gets 10ms of CPU per request and rendering a PNG costs hundreds,
# so image rendering has to happen somewhere with a real CPU budget.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol, e.g. RELIANCE"
        required: true
        type: string

concurrency:
  group: stockie-chart-${{ inputs.symbol }}
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render and send
        env:
          SYMBOL: ${{ inputs.symbol }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m stockie.main --chart "$SYMBOL"
