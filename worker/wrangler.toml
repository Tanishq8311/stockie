name = "stockie-token"
main = "kite-token.js"
compatibility_date = "2025-01-01"

# Each person needs their OWN KV namespace — this id is not shared.
#   npx wrangler kv namespace create TOKENS
# then paste the id it prints below, replacing the placeholder.
[[kv_namespaces]]
binding = "TOKENS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"
